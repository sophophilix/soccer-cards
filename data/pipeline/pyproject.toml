[project]
name = "soccer-cards-data"
version = "0.1.0"
description = "Builds the Soccer Cards static API from public facts and licensed photos."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
scdata = "soccer_cards_data.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Only releases at least two weeks old (the brief's cutoff). Moving it is a
# reviewed change to this line, never a command-line flag.
exclude-newer = "2026-11-07T00:00:00Z"
# A dependency without a wheel fails the sync instead of building from source.
# uv's `no-build = true` also refuses to build this project, so every locked
# package and the build backend are named here instead.
# tests/test_project.py fails if one is missing.
no-build-package = [
    "anyio",
    "ast-serialize",
    "bandit",
    "certifi",
    "colorama",
    "coverage",
    "h11",
    "httpcore",
    "httpx",
    "hypothesis",
    "idna",
    "iniconfig",
    "librt",
    "markdown-it-py",
    "mdurl",
    "mypy",
    "mypy-extensions",
    "packaging",
    "pathspec",
    "pluggy",
    "pygments",
    "pytest",
    "pytest-cov",
    "pyyaml",
    "rich",
    "ruff",
    "sortedcontainers",
    "stevedore",
    "typing-extensions",
    "uv_build",
]

[tool.uv.build-backend]
module-name = "soccer_cards_data"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP", "C4", "SIM", "RUF", "D"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and test names say what each test checks.
"tests/**" = ["S101", "D"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short --import-mode=importlib --cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source_pkgs = ["soccer_cards_data"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
