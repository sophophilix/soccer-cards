# Secret and dependency scans (the ci-supply-chain skill, "The gates").
# The weekly run catches an advisory published after a merge.
# Each job name is a required check on `main`. Don't rename one without the
# tech lead changing the ruleset.
name: scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1' # Mondays, 05:23 UTC

permissions:
  contents: read

# The event is in the group so a push to `main` never cancels the weekly run.
concurrency:
  group: scans-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the full history, not only the newest commit
          persist-credentials: false
      - name: Download gitleaks and check its SHA-256
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      # With no `--log-opts`, gitleaks reads `git log --full-history --all`:
      # every commit the checkout fetched. Any finding exits 1.
      - name: Scan the full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download OSV-Scanner and check its SHA-256
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
      # Exit 1 is a known vulnerability. `osv-scanner.toml` holds the ignores.
      # pnpm-lock.yaml has two YAML documents, and a scanner that reads none
      # or only the first finds less and still passes. So the step also fails
      # unless the scanner found every package the lockfile resolves.
      - name: Scan pnpm-lock.yaml
        run: |
          status=0
          "$RUNNER_TEMP/osv-scanner" scan source --config=osv-scanner.toml \
            --lockfile=pnpm-lock.yaml >"$RUNNER_TEMP/osv.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/osv.log"
          expected="$(grep --count '^    resolution:' pnpm-lock.yaml || true)"
          found="$(sed -nE 's/.*found ([0-9]+) packages.*/\1/p' "$RUNNER_TEMP/osv.log" | head -n 1)"
          if [ "$expected" -eq 0 ] || [ "${found:-0}" -lt "$expected" ]; then
            echo "::error::OSV-Scanner found ${found:-0} packages, and pnpm-lock.yaml resolves $expected"
            exit 1
          fi
          exit "$status"

  # Compares the pull request's dependencies with its base, so it has
  # nothing to do on a push or on the weekly run and is skipped there.
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
