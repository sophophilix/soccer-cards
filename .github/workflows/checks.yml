# Runs the gates a developer runs: `make check COMPONENT=<name>` (ADR 0004 D4).
# Each job name is a required check on `main`. Don't rename one without the
# tech lead changing the ruleset.
# On `main`, `deploy.yml` calls this workflow and deploys only when it passes.
name: checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push cancels a pull request's older run. Any other run gets a group
# of its own, so a `main` run's checks start at once, behind no other run, and
# are never cancelled. deploy.yml queues only its deploy and apply jobs.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Says which component gates a pull request needs. Every other event runs
  # them all. A gate is skipped only when this job succeeded and said `false`,
  # so a failure here runs every gate. A skipped job reports success under its
  # own name, so the required checks stay the same.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
      schema: ${{ steps.diff.outputs.schema }}
      game: ${{ steps.diff.outputs.game }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      # A pull request's merge commit and its first parent, the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # File names stay shell data. --no-renames lists a moved file under its
      # old path and its new one, so moving a file out of a component still
      # runs that component's gate. -z and quotePath=false keep each name as it
      # is. A name no rule places runs every gate. sdlc and docs always run.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          infra=false schema=false game=false web=false
          if [ "$EVENT" != pull_request ] || ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            infra=true schema=true game=true web=true
          else
            git -c core.quotePath=false diff --no-renames --name-only -z 'HEAD^1' HEAD > "${RUNNER_TEMP}/changed"
            while IFS= read -r -d '' f; do
              case "$f" in
                .github/workflows/checks.yml) infra=true schema=true game=true web=true ;;
                infra/*) infra=true ;;
                packages/schema/*) schema=true game=true web=true ;;
                packages/game/*) game=true web=true ;;
                apps/web/*) web=true ;;
                docs/* | tools/sdlc/* | bin/* | .claude/* | .github/* | evals/* | prototype/* | *.md | LICENSE) ;;
                # The Makefile, the pnpm lockfile, the workspace, the shared
                # tool configs and any name no rule places.
                *) infra=true schema=true game=true web=true ;;
              esac
            done < "${RUNNER_TEMP}/changed"
          fi
          {
            echo "infra=$infra"
            echo "schema=$schema"
            echo "game=$game"
            echo "web=$web"
          } | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  # The kit gates use the runner image's Python 3 and need no packages.
  sdlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make check COMPONENT=sdlc

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make check COMPONENT=docs

  # Mock providers only: no backend, no credentials (the opentofu skill).
  infra:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.infra != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version in infra/versions.tf. The checksum is the published one
      # for tofu_1.13.9_linux_amd64.zip. Change all three together.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
          checksums: bc44eb6b06446ba83bd4072114891987f590f66cca712737a7f1147c50c539ce
      - run: make check COMPONENT=infra

  schema:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.schema != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          # The pnpm store, keyed on the lockfile, on pull requests only. A
          # `main` run holds deploy secrets, so it neither reads nor writes it.
          cache: ${{ github.event_name == 'pull_request' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: make check COMPONENT=schema

  game:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.game != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          # As in the schema job.
          cache: ${{ github.event_name == 'pull_request' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: make check COMPONENT=game

  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Playwright's image holds the browsers and their system packages, so the
    # job downloads none. The tag must equal the Playwright version in
    # pnpm-lock.yaml. Change the tag, the digest and this comment together.
    # The job runs as root, the image's default, which the apt step needs.
    # `--init` and `--ipc=host` are what Playwright's Docker page recommends:
    # without the second, Chromium can run out of memory.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image has no make. apt checks the package against the SHA-256 in
      # Ubuntu's signed index. The image also keeps NodeSource's apt source,
      # which apt reads first and would trust for make too. Remove it, so
      # Ubuntu is the only publisher. Node comes from setup-node below.
      - run: |
          rm -f /etc/apt/sources.list.d/nodesource.list
          apt-get update
          apt-get install -y --no-install-recommends make=4.3-4.1build2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # The image has its own Node. The gate uses the repository's version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          # As in the schema job. The Playwright browsers come from the pinned
          # image above, so the job downloads none and caches none.
          cache: ${{ github.event_name == 'pull_request' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Playwright finds no browser when its version and the image's differ.
      # The image records its version in /ms-playwright/.docker-info.
      - name: Check that the image and the lockfile hold the same Playwright
        run: |
          image="$(node -p 'JSON.parse(require("fs").readFileSync("/ms-playwright/.docker-info", "utf8")).driverVersion')"
          locked="$(pnpm exec playwright --version)"
          if [ "$locked" != "Version $image" ]; then
            echo "::error::The container image holds Playwright $image and pnpm-lock.yaml holds ${locked#Version }. Set the image tag and digest of the web job to the lockfile's version."
            exit 1
          fi
      - run: make check COMPONENT=web
      # On `main`, deploy.yml deploys this build, the one the gate tested
      # (ADR 0002 D3). Seven days covers a wait for the tech lead's approval.
      - if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/web/build/
          if-no-files-found: error
          retention-days: 7
      # Keeps the traces, screenshots and videos of failed Playwright tests.
      # The folder is absent when the gate failed before those tests ran.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
