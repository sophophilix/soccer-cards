# The pipeline for `main` (ADR 0002 D3): run every gate in `checks.yml` on
# this commit, then deploy it after the tech lead approves the `production`
# environment. infra/ is planned on every run, and applied after a second
# approval only when the plan has changes.
# Rollback stays with the tech lead (ADR 0002 D7).
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time, and a run in progress is never cancelled. A newer push
# replaces only a run that is still pending, so the run that starts next is
# always the newest commit.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same jobs a pull request runs. A failed job stops the deploy, and can
  # be re-run in this run; the deploy then continues after approval.
  checks:
    # actionlint 1.7.12 can't parse the `$/` form zizmor asks for. Remove the
    # ignore and switch to `$/` when actionlint supports it. Expires 2027-02-20.
    uses: ./.github/workflows/checks.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  deploy:
    name: Deploy to production
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The job waits here for the tech lead's approval. An approval never given
    # expires with the run, and nothing deploys.
    environment:
      name: production
      url: https://soccercards.dsantmaj.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # This job holds the deploy token, so it runs no build and no install
      # script. It installs the root tools only, where wrangler lives.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter soccer-cards
      # The build the `web` gate tested in this run, checked against the
      # digest the upload recorded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: apps/web/build
          digest-mismatch: error
      # Re-running an older run's failed job after a newer commit deployed
      # would otherwise put the older commit back on the site.
      - name: Stop unless this commit is still the head of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main moved to ${head}. That commit deploys in its own run. ${GITHUB_SHA} does not."
            echo "Not deployed: \`main\` moved to \`${head}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Deploy the build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm exec wrangler deploy --config apps/web/wrangler.jsonc --message "main ${GITHUB_SHA}"

  # Plans every run, so drift made in the dashboard shows up too. It needs no
  # approval: `infra-plan` is `main` only and holds read-only credentials, so
  # this job can't lock or change anything (ADR 0002 D9). The tech lead reads
  # its summary before approving `apply`.
  plan:
    name: Plan infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infra-plan
    permissions:
      contents: read
      id-token: write # The azurerm backend signs in to Azure with OpenID Connect.
    outputs:
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
      changes: ${{ steps.plan.outputs.changes }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Same version and checksum as the infra job in checks.yml.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
          checksums: bc44eb6b06446ba83bd4072114891987f590f66cca712737a7f1147c50c539ce
      # Lets the az CLI below check that the state exists.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # The credentials reach this step only. The summary is built from the
      # plan JSON's resource_changes: addresses and actions, never values. The
      # plan text and the JSON are never printed.
      - id: plan
        name: Plan
        env:
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_TOKEN }}
          TF_IN_AUTOMATION: 'true'
        run: |
          set -o pipefail
          if grep -rqE 'nonsensitive[[:space:]]*\(' --include='*.tf' --include='*.tf.json' .; then
            echo "::error::infra/ calls nonsensitive(). Remove it."; exit 1
          fi
          # With no state blob, the backend would write one, which this
          # read-only identity can't (`azurerm` backend StateMgr). `apply`
          # creates it after approval and applies nothing.
          if [ "$(az storage blob exists --auth-mode login --account-name "$TF_STATE_STORAGE_ACCOUNT" --container-name tfstate --name soccer-cards.tfstate --query exists -o tsv)" != true ]; then
            echo "No state exists yet. After approval, \`Apply infrastructure\` creates it, shows the plan, and applies nothing." >> "$GITHUB_STEP_SUMMARY"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tofu init -input=false -lockfile=readonly \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config=container_name=tfstate
          # Exit code 0 is no changes, 2 is changes, anything else is an error.
          set +e
          tofu plan -input=false -lock=false -no-color -detailed-exitcode -var-file=production.tfvars -out=tfplan > /dev/null
          code=$?
          set -e
          if [ "$code" = 0 ]; then
            echo "No infrastructure changes. Nothing to apply, and nothing waits." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$code" = 2 ] || exit "$code"
          json="$(tofu show -json tfplan)"
          if jq -e '[.output_changes[]? | select(.actions != ["no-op"])] | length > 0' <<< "$json" > /dev/null; then
            echo "::error::The plan changes an output. Outputs aren't allowed in infra/."; exit 1
          fi
          fingerprint="$(jq -cS '[.resource_changes[]? | select(.change.actions != ["no-op"]) | {address, change: (.change | {actions, before, after, after_unknown})}]' <<< "$json" | sha256sum | cut -d' ' -f1)"
          {
            echo '### Infrastructure plan'
            jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) | "- `\(.address)`: \(.change.actions | join(" then "))"' <<< "$json"
            echo "Resource changes SHA-256: \`${fingerprint}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if jq -e '[.resource_changes[]? | select(.change.actions | index("delete"))] | length > 0' <<< "$json" > /dev/null; then
            echo "### Not applied: the plan destroys or replaces resources" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The plan destroys or replaces resources. The tech lead decides how to proceed."
            exit 1
          fi
          echo "changes=true" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"

  # Runs only when `plan` found changes, or found no state. A plan made with
  # read-only credentials can't be applied, so this job plans again and
  # applies its own saved plan only when it matches the one the tech lead
  # read. The Worker exists by now, so the custom domain can attach to it
  # (ADR 0002 D8).
  apply:
    name: Apply infrastructure
    needs: [deploy, plan]
    if: ${{ needs.plan.outputs.changes == 'true' || needs.plan.outputs.bootstrap == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Waits for the tech lead. This identity is the only one that can write
    # and lock the state (ADR 0002 D9).
    environment: production
    # A second guard on the state beside the workflow's group. Never cancelled.
    concurrency:
      group: opentofu-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # The azurerm backend signs in to Azure with OpenID Connect.
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Same version and checksum as the infra job in checks.yml.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
          checksums: bc44eb6b06446ba83bd4072114891987f590f66cca712737a7f1147c50c539ce
      # An older run re-run after a newer commit would apply older code.
      - name: Stop unless this commit is still the head of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main moved to ${head}. That commit applies in its own run."
            echo "Not applied: \`main\` moved to \`${head}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # The credentials reach this step only. The fingerprint is computed as
      # in `plan`, so anything changed since then stops the run. On the first
      # run, init creates the empty state and the plan is shown, not applied.
      - name: Plan again, and apply if it matches the plan the tech lead read
        env:
          BOOTSTRAP: ${{ needs.plan.outputs.bootstrap }}
          SEEN: ${{ needs.plan.outputs.fingerprint }}
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_TOKEN }}
          TF_IN_AUTOMATION: 'true'
        run: |
          set -o pipefail
          tofu init -input=false -lockfile=readonly \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config=container_name=tfstate
          tofu plan -input=false -lock-timeout=5m -no-color -var-file=production.tfvars -out=tfplan > /dev/null
          json="$(tofu show -json tfplan)"
          gone="$(jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | .address' <<< "$json")"
          fingerprint="$(jq -cS '[.resource_changes[]? | select(.change.actions != ["no-op"]) | {address, change: (.change | {actions, before, after, after_unknown})}]' <<< "$json" | sha256sum | cut -d' ' -f1)"
          if [ "$BOOTSTRAP" = true ] || [ -n "$gone" ] || [ "$fingerprint" != "$SEEN" ]; then
            {
              echo "### Not applied: a first run, a plan that differs from Plan infrastructure, or a destroy or replace"
              jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) | "- `\(.address)`: \(.change.actions | join(" then "))"' <<< "$json"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$BOOTSTRAP" = true ]; then
              echo "The state now exists. The next run on \`main\` shows this plan and asks to apply it." >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            echo "::error::The plan changed since the tech lead read it, or destroys or replaces resources. Nothing was applied."
            exit 1
          fi
          tofu apply -input=false -no-color tfplan
          echo "Applied the plan with resource changes SHA-256 \`${fingerprint}\`." >> "$GITHUB_STEP_SUMMARY"
